name: Verify CALISTA VITA gallery
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify-gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify gallery and responsive hooks
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f assets/gallery.js
          grep -q "calista-premium-fix" index.html || true
          grep -q "Everything that makes" index.html
          grep -q "Jewellery" index.html
          grep -q "Handbags" index.html
          grep -q "Perfume & Fragrance" index.html
          grep -q "Handmade & Home" index.html
          grep -q "autoplay muted loop playsinline" index.html
          grep -q "5000" assets/gallery.js
          echo "CALISTA VITA gallery structure and responsive assets verified."