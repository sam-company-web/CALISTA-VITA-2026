name: Verify CALISTA VITA exact hero
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  browser-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run local site and verify exact viewer result
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/calista-server.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT
          sleep 2
          node <<'NODE'
          const { chromium } = require('playwright');
          const EXPECTED_SHA='d5c0e3d0d8fa52d68bc4440782c9239c5d647c2d506aceffadde51d5bef07db8';
          async function inspect(page,label){
            await page.waitForFunction(() => document.querySelector('#calistaExactHero')?.dataset.heroExact === 'true', null, {timeout:30000});
            const hero=page.locator('#calistaExactHero').first();
            const info=await hero.evaluate(img => ({
              complete:img.complete,naturalWidth:img.naturalWidth,naturalHeight:img.naturalHeight,
              sha:img.dataset.heroSha256||'',exact:img.dataset.heroExact||'',
              heroBytes:img.dataset.heroBytes||'',rect:img.getBoundingClientRect().toJSON()
            }));
            if(!info.complete || info.naturalWidth!==2048 || info.naturalHeight!==1355) throw new Error(label+'_HERO_IMAGE_NOT_EXACT '+JSON.stringify(info));
            if(info.exact!=='true' || Number(info.heroBytes)!==421251) throw new Error(label+'_HERO_BYTE_CHECK_FAILED '+JSON.stringify(info));
            if(info.rect.width < 300 || info.rect.height < 180) throw new Error(label+'_HERO_NOT_VISIBLE '+JSON.stringify(info.rect));
            const ratio=info.rect.width/info.rect.height;
            if(Math.abs(ratio-(2048/1355))>0.02) throw new Error(label+'_HERO_RATIO_CHANGED '+JSON.stringify(info.rect));
            return info;
          }
          (async () => {
            const browser=await chromium.launch({headless:true});
            const failed=[];
            const responses=[];
            const viewports=[
              ['DESKTOP',1536,1024],
              ['TABLET',768,1024],
              ['MOBILE',390,844]
            ];
            const results=[];
            for(const [label,w,h] of viewports){
              const page=await browser.newPage({viewport:{width:w,height:h},deviceScaleFactor:1});
              page.on('console',m=>{if(m.type()==='error')failed.push(label+':console:'+m.text());});
              page.on('pageerror',e=>failed.push(label+':pageerror:'+e.message));
              page.on('response',r=>responses.push({label,url:r.url(),status:r.status()}));
              await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
              results.push([label,await inspect(page,label)]);
              await page.screenshot({path:'viewer-'+label.toLowerCase()+'.png',fullPage:false});
              await page.close();
            }
            const bad=responses.filter(x=>x.status>=400);
            if(bad.length) throw new Error('HTTP_ERRORS '+JSON.stringify(bad.slice(0,20)));
            if(failed.length) throw new Error('BROWSER_ERRORS '+JSON.stringify(failed));
            console.log('VIEWER_RESULT',JSON.stringify({results,expectedSha:EXPECTED_SHA}));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1);});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calista-exact-hero-viewer
          path: |
            viewer-desktop.png
            viewer-tablet.png
            viewer-mobile.png
