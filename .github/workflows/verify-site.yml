name: Verify CALISTA VITA exact hero
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  browser-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run local site and verify exact viewer result
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/calista-server.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT
          sleep 2
          node <<'NODE'
          const { chromium } = require('playwright');
          const EXPECTED_SHA='d5c0e3d0d8fa52d68bc4440782c9239c5d647c2d506aceffadde51d5bef07db8';
          async function inspect(page,label){
            await page.waitForFunction(() => document.querySelector('#calistaExactHero')?.dataset.heroExact === 'true', null, {timeout:30000});
            const hero=page.locator('#calistaExactHero').first();
            const info=await hero.evaluate(img => ({
              complete:img.complete,
              naturalWidth:img.naturalWidth,
              naturalHeight:img.naturalHeight,
              sha:img.dataset.heroSha256||'',
              exact:img.dataset.heroExact||'',
              heroBytes:img.dataset.heroBytes||'',
              rect:img.getBoundingClientRect().toJSON()
            }));
            if(!info.complete || info.naturalWidth!==2048 || info.naturalHeight!==1355) throw new Error(label+'_HERO_IMAGE_NOT_EXACT '+JSON.stringify(info));
            if(info.exact!=='true' || Number(info.heroBytes)!==421251) throw new Error(label+'_HERO_BYTE_CHECK_FAILED '+JSON.stringify(info));
            if(info.rect.width < 300 || info.rect.height < 180) throw new Error(label+'_HERO_NOT_VISIBLE '+JSON.stringify(info.rect));
            const ratio=info.rect.width/info.rect.height;
            if(Math.abs(ratio-(2048/1355))>0.02) throw new Error(label+'_HERO_RATIO_CHANGED '+JSON.stringify(info.rect));
            return info;
          }
          (async () => {
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1536,height:1024},deviceScaleFactor:1});
            const failed=[];
            const responses=[];
            page.on('console',m=>{if(m.type()==='error')failed.push('console:'+m.text());});
            page.on('pageerror',e=>failed.push('pageerror:'+e.message));
            page.on('response',r=>responses.push({url:r.url(),status:r.status()}));
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
            const desktop=await inspect(page,'DESKTOP');
            const desktopB64=await page.evaluate(async()=>{const r=await fetch(document.querySelector('#calistaExactHero').src);const b=new Uint8Array(await r.arrayBuffer());let s='';for(let i=0;i<b.length;i+=32768)s+=String.fromCharCode(...b.subarray(i,i+32768));return btoa(s);});
            const desktopHash=require('crypto').createHash('sha256').update(Buffer.from(desktopB64,'base64')).digest('hex');
            if(desktopHash!==EXPECTED_SHA) throw new Error('DESKTOP_EXACT_SHA_MISMATCH '+desktopHash);
            const cta=page.locator('.hero-cta-hit').first();
            const heroRect=await page.locator('.hero').evaluate(el=>el.getBoundingClientRect().toJSON());
            const ctaRect=await cta.evaluate(el=>el.getBoundingClientRect().toJSON());
            if(ctaRect.x<heroRect.x || ctaRect.y<heroRect.y || ctaRect.right>heroRect.right || ctaRect.bottom>heroRect.bottom) throw new Error('CTA_OUTSIDE_HERO '+JSON.stringify({heroRect,ctaRect}));
            await cta.click();
            await page.waitForTimeout(100);
            if(await page.evaluate(()=>location.hash)!=='#collections') throw new Error('CTA_DID_NOT_NAVIGATE');
            await page.screenshot({path:'viewer-desktop.png',fullPage:false});
            const mobile=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
            const mobileResponses=[];
            mobile.on('response',r=>mobileResponses.push({url:r.url(),status:r.status()}));
            mobile.on('console',m=>{if(m.type()==='error')failed.push('mobile-console:'+m.text());});
            mobile.on('pageerror',e=>failed.push('mobile-pageerror:'+e.message));
            await mobile.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
            const mobileInfo=await inspect(mobile,'MOBILE');
            const mobileB64=await mobile.evaluate(async()=>{const r=await fetch(document.querySelector('#calistaExactHero').src);const b=new Uint8Array(await r.arrayBuffer());let s='';for(let i=0;i<b.length;i+=32768)s+=String.fromCharCode(...b.subarray(i,i+32768));return btoa(s);});
            const mobileHash=require('crypto').createHash('sha256').update(Buffer.from(mobileB64,'base64')).digest('hex');
            if(mobileHash!==EXPECTED_SHA) throw new Error('MOBILE_EXACT_SHA_MISMATCH '+mobileHash);
            const mobileCta=mobile.locator('.hero-cta-hit').first();
            await mobileCta.click();
            await mobile.waitForTimeout(100);
            if(await mobile.evaluate(()=>location.hash)!=='#collections') throw new Error('MOBILE_CTA_DID_NOT_NAVIGATE');
            await mobile.screenshot({path:'viewer-mobile.png',fullPage:false});
            const bad=[...responses,...mobileResponses].filter(x=>x.status>=400);
            if(bad.length) throw new Error('HTTP_ERRORS '+JSON.stringify(bad.slice(0,20)));
            if(failed.length) throw new Error('BROWSER_ERRORS '+JSON.stringify(failed));
            console.log('VIEWER_RESULT',JSON.stringify({desktop,mobile:mobileInfo,expectedSha:EXPECTED_SHA}));
            await mobile.close();
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1);});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calista-exact-hero-viewer
          path: |
            viewer-desktop.png
            viewer-mobile.png
